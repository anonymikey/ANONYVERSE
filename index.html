<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANONYVERSE | Movies, Shows, Anime, Live TV &amp; Sports</title>
<meta name="description" content="ANONYVERSE: stream movies, shows, anime, live TV and sports in one place.">
<meta name="theme-color" content="#e50914">
<meta property="og:title" content="ANONYVERSE">
<meta property="og:description" content="Movies, shows, anime, live TV and sports in one place.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="splash" aria-hidden="true"><div><i></i><img src="/assets/logo.png" alt=""><b>ANONYVERSE</b></div></div>
<aside class="side" id="side" aria-label="Main navigation">
  <a class="brand" href="#home"><img src="/assets/logo.png" alt="ANONYVERSE"><b class="lbl">ANONYVERSE</b></a>
  <nav class="nav" id="nav"></nav>
  <div class="sfoot" id="sfoot"></div>
</aside>
<header class="top">
  <img class="mlogo" src="/assets/logo.png" alt="ANONYVERSE" width="36" height="36">
  <h1 id="title">Home</h1>
  <div class="search" role="search"><span id="searchIco"></span>
    <input id="q" type="search" placeholder="Search movies, shows, anime ( / )" aria-label="Search" aria-controls="sg" aria-autocomplete="list" autocomplete="off" enterkeyhint="search">
    <button id="qx" aria-label="Clear search" hidden></button>
    <div class="sg" id="sg" role="listbox" hidden></div></div>
</header>
<main id="view" aria-live="polite"></main>
<footer class="foot" id="foot"></footer>

<dialog id="detail" aria-label="Details"><button class="dclose" id="dclose" aria-label="Close"></button><div id="dbox"></div></dialog>
<dialog id="player" aria-label="Player">
  <div class="stage">
    <video id="vid" controls playsinline></video>
    <iframe id="frm" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen hidden title="Live player"></iframe>
    <div class="ld" id="ld"><div><span class="spin"></span><img src="/assets/logo.png" alt=""></div></div>
    <button class="btn red" id="playBtn" hidden></button>
    <button class="pxx" id="pxx" aria-label="Close player"></button>
    <div class="status" id="status" role="status"></div>
  </div>
  <div class="pinfo">
    <div><h3 id="pTitle"></h3><small id="pMeta"></small></div>
    <div class="ctl">
      <select id="res" aria-label="Quality"><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select>
      <button class="x" id="next" hidden>Next episode</button>
      <button class="x" id="dl" hidden>Download</button>
      <button class="x" id="pip">PiP</button>
      <a class="x" id="rep" href="https://t.me/ANONYMIKEY" target="_blank" rel="noopener">Report</a>
      <button class="x" id="pclose">Close</button>
    </div>
  </div>
</dialog>
</body>
</html>
